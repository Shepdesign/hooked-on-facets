name: Sync Wiki

# Keeps the GitHub Wiki in sync with the versioned docs in /docs.
# Runs on GitHub's runners (which can write the wiki repo), so the wiki
# stays current automatically without any manual editing.
#
# One-time prerequisite: the wiki must exist. Create any single page once
# via the repo's Wiki tab, then this workflow maintains it from /docs.

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Sync /docs to the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WIKI="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"

          if ! git clone --depth 1 "$WIKI" wiki 2>/dev/null; then
            echo "::error::Could not clone the wiki. Create one page via the repo's Wiki tab once, then re-run."
            exit 1
          fi

          # Acronyms preserved after title-casing so existing page URLs are kept.
          ACRONYMS="Dna:DNA Faq:FAQ Ai:AI Api:API Seo:SEO Url:URL Css:CSS Html:HTML Json:JSON Sql:SQL Eav:EAV"
          titlecase() {
            local p
            p="$(echo "$1" | sed -E 's/(^|-)([a-z])/\1\U\2/g')"
            for a in $ACRONYMS; do
              p="$(echo "$p" | sed -E "s/(^|-)${a%%:*}(-|\$)/\1${a##*:}\2/g")"
            done
            echo "$p"
          }

          declare -A keep=( ["Home.md"]=1 )
          cp docs/README.md wiki/Home.md

          # Content pages from /docs (launch-checklist stays internal).
          for f in docs/*.md; do
            base="$(basename "$f" .md)"
            case "$base" in README|launch-checklist) continue ;; esac
            case "$base" in _*) continue ;; esac
            page="$(titlecase "$base")"
            cp "$f" "wiki/$page.md"; keep["$page.md"]=1
          done

          # Nav pages (verbatim — no title-casing).
          for u in _Sidebar _Footer; do
            if [ -f "docs/$u.md" ]; then cp "docs/$u.md" "wiki/$u.md"; keep["$u.md"]=1; fi
          done

          # Community files single-sourced at repo root -> published to the wiki.
          cp CONTRIBUTING.md    wiki/Contributing.md;    keep["Contributing.md"]=1
          cp CODE_OF_CONDUCT.md wiki/Code-of-Conduct.md; keep["Code-of-Conduct.md"]=1
          cp CHANGELOG.md       wiki/Changelog.md;       keep["Changelog.md"]=1

          # Prune wiki pages with no source. Unsourced _* pages are left untouched.
          for w in wiki/*.md; do
            name="$(basename "$w")"
            [ -n "${keep[$name]:-}" ] && continue
            case "$name" in _*) continue ;; esac
            echo "Pruning stale wiki page: $name"
            rm -f "$w"
          done

          cd wiki
          git config user.name  "SHEPDESIGN"
          git config user.email "support@hookedonfacets.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
          else
            git commit -m "docs: sync from /docs @ ${{ github.sha }}"
            git push
          fi
