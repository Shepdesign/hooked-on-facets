name: Sync Wiki

# Keeps the GitHub Wiki in sync with the versioned docs in /docs.
# Runs on GitHub's runners (which can write the wiki repo), so the wiki
# stays current automatically without any manual editing.
#
# One-time prerequisite: the wiki must exist. Create any single page once
# via the repo's Wiki tab, then this workflow maintains it from /docs.

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Sync /docs to the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WIKI="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"

          if ! git clone --depth 1 "$WIKI" wiki 2>/dev/null; then
            echo "::error::Could not clone the wiki. Create one page via the repo's Wiki tab once, then re-run."
            exit 1
          fi

          # docs/README.md -> Home; every other page -> Title-Cased name.
          # launch-checklist is internal, so it is not published to the wiki.
          cp docs/README.md wiki/Home.md
          for f in docs/*.md; do
            base="$(basename "$f" .md)"
            case "$base" in
              README|launch-checklist) continue ;;
            esac
            page="$(echo "$base" | sed -E 's/(^|-)([a-z])/\1\U\2/g')"
            cp "$f" "wiki/$page.md"
          done

          cd wiki
          git config user.name  "SHEPDESIGN"
          git config user.email "support@hookedonfacets.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
          else
            git commit -m "docs: sync from /docs @ ${{ github.sha }}"
            git push
          fi
