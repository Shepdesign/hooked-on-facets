name: Release

# Builds the distributable plugin ZIP and publishes a GitHub Release.
#
# Fires automatically when the plugin version changes on main, and can be
# run on demand from the Actions tab (or via API). It no-ops if a release
# for the current version already exists, so it is safe to re-run.

on:
  push:
    branches: [main]
    paths: ['hooked-on-facets.php']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: v
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.v.outputs.version }} already exists — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP
        if: steps.exists.outputs.skip == 'false'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        if: steps.exists.outputs.skip == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build production assets
        if: steps.exists.outputs.skip == 'false'
        run: |
          composer install --no-dev --optimize-autoloader --no-progress
          npm ci
          npm run build

      - name: Package plugin ZIP
        if: steps.exists.outputs.skip == 'false'
        id: pkg
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          STAGE="$RUNNER_TEMP/hof/hooked-on-facets"
          mkdir -p "$STAGE/assets"
          cp hooked-on-facets.php uninstall.php readme.txt "$STAGE/"
          cp -r includes src integrations languages vendor "$STAGE/"
          cp -r assets/dist "$STAGE/assets/"
          find "$STAGE/assets" -name '*.map' -delete
          ZIP="$RUNNER_TEMP/hof/hooked-on-facets-$VERSION.zip"
          ( cd "$RUNNER_TEMP/hof" && zip -rqX "hooked-on-facets-$VERSION.zip" hooked-on-facets )
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          gh release create "v$VERSION" "${{ steps.pkg.outputs.zip }}" \
            --target "${{ github.sha }}" \
            --title "Hooked on Facets $VERSION" \
            --generate-notes
